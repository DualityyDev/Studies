<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <title>Inscrição</title>
    <link rel="stylesheet" href="Estilos form.css">
</head>
<body class="fundo">
    <div class="caixa">
        <h1>Formulario de Inscrição</h1>
        <form action="./inscricao.html" method="post">
            <fieldset>
                <legend>Dados pessoais</legend>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Nome" required>
                <p></p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nome@exemplo.pt" required>
                <p></p>
                <p>Em qual ano estás?</p>
                <label for="Ano">10 Ano</label>
                <input type="radio" id="Ano" name="Ano" required> 
                <label for="Ano">11 Ano</label>
                <input type="radio" id="Ano" name="Ano" required>
                <label for="Ano">12 Ano</label>
                <input type="radio" id="Ano" name="Ano" required>
            </fieldset>
            <fieldset>
                <legend>Clube</legend>
                <label for="clube">Clube</label>
                <select id="clube" name="clube" required>
                    <option value=""></option>
                    <option value="clube1">Fotografia</option>
                    <option value="clube2">Futebol</option>
                    <option value="clube3">Natação</option>
                </select>
            </fieldset>
            
            <fieldset>
                <legend>Opcionais</legend>
                <label for="mensagem">Mensagem</label>
                <p></p>
                <textarea id="mensagem" name="mensagem" placeholder="Mensagem aqui"></textarea>
                <p></p>
                <label for="Novidades">Enviar novidades por email </label>
                <input type="checkbox" id="Novidades" name="Novidades">
                <p></p>
            </fieldset>
            <p></p>
            <button class="button" type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
